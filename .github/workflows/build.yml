# 在 Windows 上打绿色版（PyInstaller 不能在 Linux 上交叉编译 exe）。
# 触发：推送 v* 标签、手动运行（Actions → build → Run workflow）。
# 产物：推 tag 时发布绿色版 ZIP 和单文件网页版；
#       手动运行时只上传 Artifacts（在运行页面下载）。
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-green:
    runs-on: windows-latest
    # 建 Release 需要写权限：新建仓库的 GITHUB_TOKEN 默认只读，不显式声明会 403。
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装开发检查工具
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 安装打包工具
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.6,<7"

      - name: 测试
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check_web_port.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check_aha_port.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_build_conversion.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_herta_loading.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify_ci_ui.ps1

      - name: 打绿色版
        run: python make_package.py --green

      - name: 生成网页版与统一附件名称
        shell: pwsh
        run: |
          $version = python -c "from core import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "dist/游戏工具箱-v$version-绿色版.zip" -Destination "dist/game-toolbox-v$version-green.zip"
          python -c "from core import __version__; from tools.make_web_standalone import build; build(with_theme=False, out_name='game-toolbox-v' + __version__ + '-web.html')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 审计绿色版内容
        shell: pwsh
        run: |
          $version = python -c "from core import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Join-Path 'dist' "游戏工具箱-v$version-绿色版.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "没有找到绿色版 zip：$zip" }
          python tools/audit_package.py $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 冒烟：解压后启动 exe，确认服务能响应、userdata 写在 exe 旁边
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*绿色版.zip" | Select-Object -First 1
          if (-not $zip) { throw "没有找到绿色版 zip" }
          $dir = Join-Path $env:RUNNER_TEMP "绿色 测试"
          Expand-Archive $zip.FullName -DestinationPath $dir -Force
          $top = (Get-ChildItem $dir | ForEach-Object Name) -join ","
          Write-Host "根目录：$top"
          foreach ($need in "游戏工具箱.exe","使用说明.html","userdata","_internal") {
            if (-not (Test-Path (Join-Path $dir $need))) { throw "缺少 $need" }
          }
          $p = Start-Process -FilePath (Join-Path $dir "游戏工具箱.exe") -ArgumentList "--no-open","--port","9450" -WindowStyle Hidden -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:9450/api/registry"; $ok = $true; break } catch {}
          }
          if (-not $ok) { Stop-Process $p -Force; throw "exe 启动后 30 秒内没有响应" }
          $body = @{ module = "honkai-star-rail"; feature = "speed-plan"; action = "save_preset"; payload = @{ characterId = "__custom__"; config = @{ superimpose = 1 } } } | ConvertTo-Json -Depth 5
          $res = Invoke-RestMethod "http://127.0.0.1:9450/api/call" -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body))
          Stop-Process $p -Force
          if (-not $res.ok) { throw "save_preset 失败" }
          if (-not (Test-Path (Join-Path $dir "userdata\honkai-star-rail\speed-plan-presets.json"))) { throw "userdata 没写在 exe 旁边" }
          Write-Host "冒烟通过：$($res.result.path)"

      - uses: actions/upload-artifact@v4
        with:
          name: game-toolbox-release
          path: |
            dist/game-toolbox-v*-green.zip
            dist/game-toolbox-v*-web.html
          if-no-files-found: error

      # 手动运行只上传 Actions 产物；标签运行创建或更新对应的 Release。
      - name: 发布绿色版和网页版
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 先确认 tag 和代码里的版本号一致 —— 不一致就停在这里，别发出一个名字对不上的包。
          $tag = "${{ github.ref_name }}"
          $codeVersion = (Select-String -Path core/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag  代码版本=$codeVersion"
          if ("v$codeVersion" -ne $tag) {
            throw "tag（$tag）和 core/__init__.py 的版本（v$codeVersion）不一致：先改版本号再打 tag"
          }
          $zip = "dist/game-toolbox-v$codeVersion-green.zip"
          $web = "dist/game-toolbox-v$codeVersion-web.html"
          if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $web)) { throw "缺少发布附件" }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $web --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }
          # 带后缀的版本（如 0.20.0beta）按预发布发，且不抢「Latest」。
          if ($codeVersion -match '[A-Za-z]') {
            gh release create $tag $zip $web --title $tag --generate-notes --verify-tag --prerelease --latest=false
          } else {
            gh release create $tag $zip $web --title $tag --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
