# 在 Windows 上打绿色版（PyInstaller 不能在 Linux 上交叉编译 exe）。
# 触发：推送 v* 标签、手动运行（Actions → build → Run workflow）。
# 产物：Actions 运行页面的 Artifacts 里下载「游戏工具箱-绿色版」（里面是 游戏工具箱-v<版本>-绿色版.zip）。
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-green:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装打包工具
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.6,<7"

      - name: 测试
        run: |
          python -m unittest discover -s tests
          node tools/check_web_port.mjs

      - name: 打绿色版
        run: python make_package.py --green

      - name: 冒烟：解压后启动 exe，确认服务能响应、userdata 写在 exe 旁边
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*绿色版.zip" | Select-Object -First 1
          if (-not $zip) { throw "没有找到绿色版 zip" }
          $dir = Join-Path $env:RUNNER_TEMP "绿色 测试"
          Expand-Archive $zip.FullName -DestinationPath $dir -Force
          $top = (Get-ChildItem $dir | ForEach-Object Name) -join ","
          Write-Host "根目录：$top"
          foreach ($need in "游戏工具箱.exe","使用说明.html","userdata","_internal") {
            if (-not (Test-Path (Join-Path $dir $need))) { throw "缺少 $need" }
          }
          $p = Start-Process -FilePath (Join-Path $dir "游戏工具箱.exe") -ArgumentList "--no-open","--port","9450" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:9450/api/registry"; $ok = $true; break } catch {}
          }
          if (-not $ok) { Stop-Process $p -Force; throw "exe 启动后 30 秒内没有响应" }
          $body = @{ module = "honkai-star-rail"; feature = "speed-plan"; action = "save_preset"; payload = @{ characterId = "__custom__"; config = @{ superimpose = 1 } } } | ConvertTo-Json -Depth 5
          $res = Invoke-RestMethod "http://127.0.0.1:9450/api/call" -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body))
          Stop-Process $p -Force
          if (-not $res.ok) { throw "save_preset 失败" }
          if (-not (Test-Path (Join-Path $dir "userdata\honkai-star-rail\speed-plan-presets.json"))) { throw "userdata 没写在 exe 旁边" }
          Write-Host "冒烟通过：$($res.result.path)"

      - uses: actions/upload-artifact@v4
        with:
          name: 游戏工具箱-绿色版
          path: dist/*绿色版.zip
          if-no-files-found: error
